included:
  - eaSplit
  - eaSplitTests

disabled_rules:
  # Keep the quality gate semantic; this project intentionally uses Xcode's
  # two-space style and trailing commas, and lint must not force reformatting.
  - line_length
  - opening_brace
  - trailing_comma
  - trailing_newline

type_name:
  excluded:
    - eaSplitApp

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 500
  error: 600

file_length:
  warning: 600
  error: 800
