name: eaSplit beta feedback
description: Report a beta problem or tell us what would make eaSplit more useful.
title: "[Beta feedback] "
labels:
  - beta-feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing eaSplit. This submission creates a public GitHub issue.
        Do not include private documents, email addresses, license keys, sensitive window titles, or screenshots that expose personal information.

  - type: dropdown
    id: area
    attributes:
      label: What are you reporting?
      options:
        - Window split or foreground behavior
        - Window discovery or selection
        - Accessibility permission or setup
        - Saved recipe or frequent suggestion
        - Shortcut or launch at login
        - Download or installation
        - User interface or accessibility
        - General feedback
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: eaSplit version and build
      description: Open eaSplit Settings and copy the version and build, for example 0.1.0 (4).
      placeholder: 0.1.0 (4)
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.6
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Mac model and chip
      description: A general model is enough; do not include a serial number.
      placeholder: 14-inch MacBook Pro, Apple M4 Pro
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Apps and layout
      description: Name only the applications, layout, ratio, and gap setting involved. Do not copy private window titles.
      placeholder: Safari and Microsoft Teams; Columns; 50 / 50; edge to edge on.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce or feedback context
      description: Give the shortest sequence that lets us understand what happened.
      placeholder: |
        1. Opened Safari and Teams.
        2. Selected both in eaSplit.
        3. Chose Columns, 50 / 50, then Split.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include exact eaSplit error text if one appeared, but omit sensitive window information.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Once
        - Not applicable - this is general feedback
    validations:
      required: true

  - type: dropdown
    id: reuse
    attributes:
      label: Would you use eaSplit in a normal week?
      options:
        - Yes, most days
        - Yes, once or twice a week
        - Occasionally
        - Not yet
    validations:
      required: true

  - type: dropdown
    id: value
    attributes:
      label: Would a polished version be worth a one-time purchase?
      options:
        - Yes
        - Maybe
        - No
        - Prefer not to answer
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report privacy check
      options:
        - label: I checked this report and removed private or sensitive information.
          required: true
