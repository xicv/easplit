name: Prepare eaSplit draft release

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: Exact beta label, for example 0.1.0-beta.5
        required: true
        type: string
      source_commit:
        description: Exact 40-character SHA currently at main
        required: true
        type: string
      confirm_unpublished_draft:
        description: Build, notarize, and upload an unpublished draft
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit }}

      - name: Validate exact candidate contract
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CONFIRMED: ${{ inputs.confirm_unpublished_draft }}
          INPUT_RELEASE_LABEL: ${{ inputs.release_label }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [[ "$INPUT_CONFIRMED" != "true" ]]; then
            echo "confirm_unpublished_draft must be selected." >&2
            exit 1
          fi
          if [[ "$INPUT_SOURCE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "source_commit must match the workflow's exact main SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$INPUT_SOURCE_COMMIT" ]]; then
            echo "The checked-out commit does not match source_commit." >&2
            exit 1
          fi
          if [[ "$(git ls-remote origin refs/heads/main | awk '{print $1}')" != "$INPUT_SOURCE_COMMIT" ]]; then
            echo "source_commit is no longer the exact origin/main commit." >&2
            exit 1
          fi

          ruby script/release_candidate_contract.rb \
            "$INPUT_RELEASE_LABEL" \
            "$INPUT_SOURCE_COMMIT" \
            >"$RUNNER_TEMP/release-contract.json"

          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${INPUT_SOURCE_COMMIT}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "quality")] | sort_by(.id) | last | (.status == "completed" and .conclusion == "success")')" != "true" ]]; then
            echo "The hosted quality check is not successful for source_commit." >&2
            exit 1
          fi

          TAG="v$INPUT_RELEASE_LABEL"
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")" ]]; then
            echo "Remote tag already exists: $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release already exists: $TAG" >&2
            exit 1
          fi

      - name: Record preflight summary
        env:
          INPUT_RELEASE_LABEL: ${{ inputs.release_label }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          {
            echo "## Release candidate preflight"
            echo
            echo "- Label: \`$INPUT_RELEASE_LABEL\`"
            echo "- Source: \`$INPUT_SOURCE_COMMIT\`"
            echo "- Result: exact main commit, release contract, hosted quality, and uniqueness passed"
            echo "- Next gate: approval for the protected \`release-candidate\` environment"
          } >>"$GITHUB_STEP_SUMMARY"

  draft:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 60
    environment: release-candidate
    permissions:
      checks: read
      contents: write
    env:
      EASPLIT_NOTARY_PROFILE: easplit-ci
    steps:
      - name: Configure ephemeral paths
        run: |
          {
            echo "EASPLIT_CI_KEYCHAIN=$RUNNER_TEMP/easplit-release.keychain-db"
            echo "EASPLIT_NOTARY_KEYCHAIN=$RUNNER_TEMP/easplit-release.keychain-db"
            echo "EASPLIT_RELEASE_DIR=$RUNNER_TEMP/easplit-release"
          } >>"$GITHUB_ENV"

      - name: Check out the exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit }}

      - name: Install build tools
        run: brew install swiftlint xcodegen

      - name: Prepare isolated signing and notarization credentials
        env:
          EASPLIT_DEVELOPER_ID_P12_BASE64: ${{ secrets.EASPLIT_DEVELOPER_ID_P12_BASE64 }}
          EASPLIT_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.EASPLIT_DEVELOPER_ID_P12_PASSWORD }}
          EASPLIT_NOTARY_ISSUER_ID: ${{ secrets.EASPLIT_NOTARY_ISSUER_ID }}
          EASPLIT_NOTARY_KEY_ID: ${{ secrets.EASPLIT_NOTARY_KEY_ID }}
          EASPLIT_NOTARY_KEY_P8_BASE64: ${{ secrets.EASPLIT_NOTARY_KEY_P8_BASE64 }}
        run: ./script/prepare_ci_release_credentials.sh "$EASPLIT_CI_KEYCHAIN"

      - name: Build, sign, notarize, package, and verify
        env:
          EASPLIT_CI_SIGNING: "1"
          EASPLIT_DEVELOPER_ID: "Developer ID Application: XI CAO (6UVB8NWW6F)"
          EASPLIT_EXPORT_OPTIONS: ${{ github.workspace }}/script/ExportOptionsCI.plist
          EASPLIT_RELEASE_LABEL: ${{ inputs.release_label }}
        run: ./script/release.sh

      - name: Create unpublished GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./script/draft_github_release.sh "$EASPLIT_RELEASE_DIR"

      - name: Retain compact release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eaSplit-${{ inputs.release_label }}-release-evidence
          if-no-files-found: ignore
          retention-days: 30
          path: |
            ${{ runner.temp }}/easplit-release/release-manifest.json
            ${{ runner.temp }}/easplit-release/*notarization*.json
            ${{ runner.temp }}/easplit-release/*.sha256

      - name: Record draft summary
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          DRAFT_URL="$(gh release view "v$INPUT_RELEASE_LABEL" --json url --jq .url)"
          {
            echo "## Unpublished release draft"
            echo
            echo "The signed, notarized, stapled, and verified beta remains unpublished."
            echo
            echo "Review and publish manually: $DRAFT_URL"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral release credentials
        if: always()
        run: |
          /usr/bin/security delete-keychain "$EASPLIT_CI_KEYCHAIN" 2>/dev/null || true
          /bin/rm -f \
            "$RUNNER_TEMP/easplit-developer-id.p12" \
            "$RUNNER_TEMP/easplit-notary-key.p8"
